name: post-release
on:
  release:
    types: [ published ]
env:
  REGISTRY: ghcr.io
  REPOSITORY_NAME: ${{ github.repository }}
  ORG: dana-team

jobs:
  build-and-push-image:
    name: Build And Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.1

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: '**/package-lock.json'

    - name: Install Dependencies
      run: npm ci --frozen-lockfile

    - name: Build with placeholders
      env:
        VITE_BACKEND_URL: "__BACKEND_URL__"
      run: npm run build

    - name: Verify placeholders
      run: |
        grep -r "__BACKEND_URL__" dist/ || (echo "❌ Backend placeholder missing" && exit 1)

    - name: Log in to container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build & Push multi-arch image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        platforms: linux/amd64
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.REPOSITORY_NAME }}:${{ github.event.release.tag_name }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Create values.yaml installer
      run: |
        cat > dist/values-installer.yaml << EOF
        image:
          repository: ${{ env.REGISTRY }}/${{ env.REPOSITORY_NAME }}
          tag: "${{ github.ref_name }}"

        env:
          BACKEND_URL: "https://backend.internal"
        EOF

    - name: Upload installer values
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/values-installer.yaml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  package-and-push-chart:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.1

    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.15.0

    - name: Set chart name
      id: chart-name
      run: echo "value=${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"

    - name: Set OCI registry name
      id: oci-registry-name
      run: echo "value=ghcr.io/${{ github.repository_owner }}/helm-charts" >> "$GITHUB_OUTPUT"

    - name: Set OCI chart name
      id: oci-chart-name
      run: echo "value=${{ steps.oci-registry-name.outputs.value }}/${{ steps.chart-name.outputs.value }}" >> "$GITHUB_OUTPUT"

    - name: Helm lint
      run: helm lint charts/${{ steps.chart-name.outputs.value }}

    - name: Trim prefix from version
      id: version
      run: echo "value=$(echo ${{ github.event.release.tag_name }} | sed 's/release-//')" >> "$GITHUB_OUTPUT"

    - name: Helm package
      id: build
      run: |
        helm package charts/${{ steps.oci-chart-name.outputs.value }} --version ${{ steps.version.outputs.value }} --app-version ${{ steps.version.outputs.value }}
        echo "package=${{ steps.oci-chart-name.outputs.value }}-${{ steps.version.outputs.value }}.tgz" >> "$GITHUB_OUTPUT"

    - name: Upload chart as artifact
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
      with:
        name: "[${{ github.job }}] Helm chart"
        path: ${{ steps.build.outputs.package }}

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Helm push
      run: helm push ${{ steps.build.outputs.package }} oci://${{ steps.oci-registry-name.outputs.value }}
      env:
        HELM_REGISTRY_CONFIG: ~/.docker/config.json
